name: Bash tests

# Manual-only: the automatic triggers (push, pull_request, schedule) were
# removed because they burned the free GitHub Actions minutes. Run this from
# the Actions tab ("Run workflow") when you actually need it.
on:
  workflow_dispatch:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bats-core
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bats tests
        run: bats tests/install/bash/
