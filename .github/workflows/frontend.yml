name: Frontend CI

# Manual-only: the automatic triggers (push, pull_request, schedule) were
# removed because they burned the free GitHub Actions minutes. Run this from
# the Actions tab ("Run workflow") when you actually need it.
on:
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Use the reviewed npm toolchain
        run: npm install --global npm@11.19.0

      - run: npm ci
      - name: Audit dependencies
        run: npm audit
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          # Optional: when the secret is unset the build still succeeds and the
          # leaderboard is disabled (see src/lib/supabase.ts). No placeholder,
          # so a keyless CI build doesn't bake in a bogus anon key.
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
